<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CodeCraftHub: Your Learning Management Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --primary: #8B5CF6;
      --primary-dark: #6D28D9;
      --success: #F59E0B;
      --danger: #EF4444;
      --bg: #F9FAFB;
      --surface: #fff;
      --text: #1F2937;
      --text-light: #6B7280;
      --border: #E5E7EB;
      --radius: 16px;
      --shadow: 0 4px 24px 0 rgba(139,92,246,0.08);
      --transition: 0.18s cubic-bezier(.4,0,.2,1);
    }
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: linear-gradient(90deg, var(--primary), var(--success));
      color: #fff;
      padding: 2rem 1rem 1.5rem 1rem;
      text-align: center;
      box-shadow: var(--shadow);
      border-radius: 0 0 var(--radius) var(--radius);
      letter-spacing: 0.01em;
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      margin-bottom: 2rem;
      transition: box-shadow var(--transition);
    }
    .card:hover {
      box-shadow: 0 8px 32px 0 rgba(139,92,246,0.13);
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .form-group {
      flex: 1 1 220px;
      display: flex;
      flex-direction: column;
    }
    .form-group label {
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--primary-dark);
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 0.6rem 0.8rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: #F3F4F6;
      color: var(--text);
      transition: border-color var(--transition);
      outline: none;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--primary);
    }
    .form-group textarea {
      min-height: 38px;
      resize: vertical;
    }
    .actions {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
    }
    .btn {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), color var(--transition), box-shadow var(--transition);
      box-shadow: 0 2px 8px 0 rgba(139,92,246,0.04);
      outline: none;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover, .btn-primary:focus {
      background: var(--primary-dark);
    }
    .btn-success {
      background: var(--success);
      color: #fff;
    }
    .btn-success:hover, .btn-success:focus {
      background: #d97706;
    }
    .btn-danger {
      background: var(--danger);
      color: #fff;
    }
    .btn-danger:hover, .btn-danger:focus {
      background: #b91c1c;
    }
    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    .btn-outline:hover, .btn-outline:focus {
      background: var(--primary);
      color: #fff;
    }
    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid #e5e7eb;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .message {
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-weight: 600;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      box-shadow: 0 2px 8px 0 rgba(139,92,246,0.04);
    }
    .message-success {
      background: #fef3c7;
      color: #92400e;
      border-left: 5px solid var(--success);
    }
    .message-error {
      background: #fee2e2;
      color: #991b1b;
      border-left: 5px solid var(--danger);
    }
    .courses-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 0.5rem;
    }
    .courses-table th, .courses-table td {
      padding: 0.8rem 0.7rem;
      text-align: left;
      background: var(--surface);
      border-radius: 8px;
      font-size: 1rem;
    }
    .courses-table th {
      color: var(--primary-dark);
      font-weight: 700;
      background: #ede9fe;
      border-bottom: 2px solid var(--primary);
    }
    .courses-table td {
      color: var(--text);
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .courses-table tr {
      transition: box-shadow var(--transition);
    }
    .courses-table tr:hover {
      box-shadow: 0 2px 12px 0 rgba(139,92,246,0.07);
    }
    .status-badge {
      display: inline-block;
      padding: 0.3em 0.9em;
      border-radius: 999px;
      font-size: 0.95em;
      font-weight: 600;
      letter-spacing: 0.01em;
      background: #ede9fe;
      color: var(--primary-dark);
    }
    .status-inprogress {
      background: #fef3c7;
      color: #92400e;
    }
    .status-completed {
      background: #d1fae5;
      color: #065f46;
    }
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(31,41,55,0.25);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 8px 32px 0 rgba(139,92,246,0.13);
      padding: 2rem 1.5rem 1.5rem 1.5rem;
      min-width: 320px;
      max-width: 95vw;
      position: relative;
      animation: modalPop 0.22s cubic-bezier(.4,0,.2,1);
    }
    @keyframes modalPop {
      from { transform: scale(0.96) translateY(24px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent;
      border: none;
      font-size: 1.7rem;
      color: var(--primary-dark);
      cursor: pointer;
      transition: color var(--transition);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover, .modal-close:focus {
      color: var(--danger);
      background: #f3f4f6;
    }
    @media (max-width: 700px) {
      .card, .modal {
        padding: 1.2rem 0.7rem 1rem 0.7rem;
      }
      .form-row {
        flex-direction: column;
        gap: 0.5rem;
      }
      .courses-table th, .courses-table td {
        font-size: 0.97rem;
        padding: 0.6rem 0.4rem;
      }
    }
    @media (max-width: 500px) {
      header h1 {
        font-size: 1.3rem;
      }
      main {
        padding: 0 0.2rem;
      }
      .courses-table th, .courses-table td {
        font-size: 0.93rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>CodeCraftHub: Your Learning Management Platform</h1>
  </header>
  <main>
    <section class="card" id="add-course-section">
      <form id="add-course-form" autocomplete="off" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="course-name">Course Name *</label>
            <input type="text" id="course-name" name="name" required maxlength="80" placeholder="e.g. JavaScript Essentials" />
          </div>
          <div class="form-group">
            <label for="course-target-date">Target Date *</label>
            <input type="date" id="course-target-date" name="target_date" required />
          </div>
          <div class="form-group">
            <label for="course-status">Status *</label>
            <select id="course-status" name="status" required>
              <option value="">Select status</option>
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex:2;">
            <label for="course-description">Description *</label>
            <textarea id="course-description" name="description" required maxlength="300" placeholder="Briefly describe the course"></textarea>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="add-course-btn">Add Course</button>
        </div>
        <div id="add-course-message"></div>
      </form>
    </section>

    <section class="card" id="courses-section">
      <div id="courses-loading" style="text-align:center; margin:2rem 0;">
        <div class="spinner"></div>
      </div>
      <div id="courses-message"></div>
      <div id="courses-list"></div>
    </section>
  </main>

  <!-- Edit Modal -->
  <div id="edit-modal-backdrop" class="modal-backdrop" style="display:none;">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
      <button class="modal-close" id="edit-modal-close" aria-label="Close">&times;</button>
      <h2 id="edit-modal-title" style="margin-top:0; color:var(--primary-dark); font-size:1.3rem;">Edit Course</h2>
      <form id="edit-course-form" autocomplete="off" novalidate>
        <input type="hidden" id="edit-course-id" name="id" />
        <div class="form-row">
          <div class="form-group">
            <label for="edit-course-name">Course Name *</label>
            <input type="text" id="edit-course-name" name="name" required maxlength="80" />
          </div>
          <div class="form-group">
            <label for="edit-course-target-date">Target Date *</label>
            <input type="date" id="edit-course-target-date" name="target_date" required />
          </div>
          <div class="form-group">
            <label for="edit-course-status">Status *</label>
            <select id="edit-course-status" name="status" required>
              <option value="">Select status</option>
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex:2;">
            <label for="edit-course-description">Description *</label>
            <textarea id="edit-course-description" name="description" required maxlength="300"></textarea>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="edit-course-save-btn">Save Changes</button>
        </div>
        <div id="edit-course-message"></div>
      </form>
    </div>
  </div>

  <script>
    // --- API CONFIG ---
    const API_BASE = 'http://localhost:8080/api/courses';

    // --- DOM ELEMENTS ---
    const coursesList = document.getElementById('courses-list');
    const coursesLoading = document.getElementById('courses-loading');
    const coursesMessage = document.getElementById('courses-message');
    const addCourseForm = document.getElementById('add-course-form');
    const addCourseMessage = document.getElementById('add-course-message');
    const addCourseBtn = document.getElementById('add-course-btn');

    // Edit Modal
    const editModalBackdrop = document.getElementById('edit-modal-backdrop');
    const editModalClose = document.getElementById('edit-modal-close');
    const editCourseForm = document.getElementById('edit-course-form');
    const editCourseMessage = document.getElementById('edit-course-message');

    // --- STATE ---
    let courses = [];
    let loadingCourses = false;
    let savingCourse = false;
    let editingCourseId = null;

    // --- HELPERS ---
    function showMessage(container, msg, type='success') {
      container.innerHTML = `<div class="message message-${type}">
        ${type === 'success' ? '✅' : '⚠️'} ${msg}
      </div>`;
      setTimeout(() => { container.innerHTML = ''; }, 3500);
    }
    function showLoading(container) {
      container.innerHTML = `<div class="spinner"></div>`;
    }
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }
    function statusBadge(status) {
      let cls = 'status-badge';
      if (status === 'In Progress') cls += ' status-inprogress';
      else if (status === 'Completed') cls += ' status-completed';
      return `<span class="${cls}">${status}</span>`;
    }
    function clearForm(form) {
      form.reset();
      Array.from(form.elements).forEach(el => {
        if (el.tagName === 'SELECT') el.selectedIndex = 0;
      });
    }

    // --- API CALLS ---
    async function fetchCourses() {
      loadingCourses = true;
      coursesLoading.style.display = '';
      coursesList.innerHTML = '';
      coursesMessage.innerHTML = '';
      try {
        const res = await fetch(API_BASE);
        if (!res.ok) throw new Error('Failed to fetch courses');
        courses = await res.json();
        renderCourses();
      } catch (err) {
        coursesMessage.innerHTML = `<div class="message message-error">⚠️ ${err.message}</div>`;
      } finally {
        loadingCourses = false;
        coursesLoading.style.display = 'none';
      }
    }

    async function addCourse(data) {
      savingCourse = true;
      addCourseBtn.disabled = true;
      showLoading(addCourseMessage);
      try {
        const res = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || 'Failed to add course');
        }
        showMessage(addCourseMessage, 'Course added successfully!', 'success');
        clearForm(addCourseForm);
        await fetchCourses();
      } catch (err) {
        showMessage(addCourseMessage, err.message, 'error');
      } finally {
        savingCourse = false;
        addCourseBtn.disabled = false;
      }
    }

    async function updateCourse(id, data) {
      savingCourse = true;
      document.getElementById('edit-course-save-btn').disabled = true;
      showLoading(editCourseMessage);
      try {
        const res = await fetch(`${API_BASE}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || 'Failed to update course');
        }
        showMessage(editCourseMessage, 'Course updated!', 'success');
        closeEditModal();
        await fetchCourses();
      } catch (err) {
        showMessage(editCourseMessage, err.message, 'error');
      } finally {
        savingCourse = false;
        document.getElementById('edit-course-save-btn').disabled = false;
      }
    }

    async function deleteCourse(id) {
      if (!confirm('Are you sure you want to delete this course?')) return;
      try {
        const res = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed to delete course');
        showMessage(coursesMessage, 'Course deleted!', 'success');
        await fetchCourses();
      } catch (err) {
        showMessage(coursesMessage, err.message, 'error');
      }
    }

    // --- RENDERING ---
    function renderCourses() {
      if (!courses.length) {
        coursesList.innerHTML = `<div style="text-align:center; color:var(--text-light); font-size:1.1rem; margin:2rem 0;">No courses found. Start by adding a new course above!</div>`;
        return;
      }
      let html = `<table class="courses-table" aria-label="Courses List">
        <thead>
          <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Target Date</th>
            <th>Status</th>
            <th>Created</th>
            <th style="text-align:center;">Actions</th>
          </tr>
        </thead>
        <tbody>
      `;
      for (const course of courses) {
        html += `
          <tr>
            <td><strong>${escapeHTML(course.name)}</strong></td>
            <td style="max-width:220px; word-break:break-word;">${escapeHTML(course.description)}</td>
            <td>${escapeHTML(course.target_date)}</td>
            <td>${statusBadge(course.status)}</td>
            <td>${formatDate(course.created_at)}</td>
            <td style="text-align:center;">
              <button class="btn btn-outline" title="Edit" onclick="openEditModal('${course.id}')">Edit</button>
              <button class="btn btn-danger" title="Remove" onclick="deleteCourse('${course.id}')">Remove</button>
            </td>
          </tr>
        `;
      }
      html += '</tbody></table>';
      coursesList.innerHTML = html;
    }

    // --- FORM HANDLERS ---
    addCourseForm.addEventListener('submit', function(e) {
      e.preventDefault();
      addCourseMessage.innerHTML = '';
      const data = {
        name: addCourseForm.name.value.trim(),
        description: addCourseForm.description.value.trim(),
        target_date: addCourseForm.target_date.value,
        status: addCourseForm.status.value
      };
      // Validation
      if (!data.name || !data.description || !data.target_date || !data.status) {
        showMessage(addCourseMessage, 'Please fill in all required fields.', 'error');
        return;
      }
      addCourse(data);
    });

    // --- EDIT MODAL LOGIC ---
    window.openEditModal = function(id) {
      const course = courses.find(c => c.id == id);
      if (!course) return;
      editingCourseId = id;
      editCourseForm.id.value = course.id;
      editCourseForm.name.value = course.name;
      editCourseForm.description.value = course.description;
      editCourseForm.target_date.value = course.target_date;
      editCourseForm.status.value = course.status;
      editCourseMessage.innerHTML = '';
      editModalBackdrop.style.display = '';
      document.body.style.overflow = 'hidden';
      setTimeout(() => {
        editCourseForm.name.focus();
      }, 100);
    };
    function closeEditModal() {
      editModalBackdrop.style.display = 'none';
      document.body.style.overflow = '';
      editingCourseId = null;
      clearForm(editCourseForm);
      editCourseMessage.innerHTML = '';
    }
    editModalClose.addEventListener('click', closeEditModal);
    editModalBackdrop.addEventListener('click', function(e) {
      if (e.target === editModalBackdrop) closeEditModal();
    });
    document.addEventListener('keydown', function(e) {
      if (editModalBackdrop.style.display !== 'none' && e.key === 'Escape') closeEditModal();
    });

    editCourseForm.addEventListener('submit', function(e) {
      e.preventDefault();
      editCourseMessage.innerHTML = '';
      const data = {
        name: editCourseForm.name.value.trim(),
        description: editCourseForm.description.value.trim(),
        target_date: editCourseForm.target_date.value,
        status: editCourseForm.status.value
      };
      if (!data.name || !data.description || !data.target_date || !data.status) {
        showMessage(editCourseMessage, 'Please fill in all required fields.', 'error');
        return;
      }
      updateCourse(editingCourseId, data);
    });

    // --- DELETE HANDLER (global for inline onclick) ---
    window.deleteCourse = deleteCourse;

    // --- ESCAPE HTML ---
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // --- INIT ---
    fetchCourses();
  </script>
</body>
</html>
